<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>AI Travel Itinerary Planner - Your Itinerary</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">

    
    <style>


        /* ===== AI Travel Itinerary Planner - Professional Dark Theme ===== */

        /* Import Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap');

        /* CSS Variables - Professional Light Theme */
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #3b82f6;
            --secondary-color: #f59e0b;
            --accent-color: #8b5cf6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;

            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --bg-card: #ffffff;

            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;

            --border-color: #e2e8f0;
            --border-hover: rgba(37, 99, 235, 0.3);

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 20px rgba(37, 99, 235, 0.3);

            --transition-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }

        /* Reset Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            min-width: 320px !important;
            width: 100%;
        }

        /* Body & Background */
        body {
    padding-top: 90px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-primary);
    min-height: 100vh;
    min-width: 320px !important;
    width: 100%;
    line-height: 1.7;
    color: var(--text-secondary);
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* Main Container */
        .container {
            max-width: 1280px;
            min-width: 320px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 1px solid var(--border-color);
            width: 100%;
            box-sizing: border-box;
        }

        /* Header */
        .header {
            background:
                linear-gradient(135deg, rgba(59, 130, 246, 0.25) 0%, rgba(139, 92, 246, 0.25) 100%),
                url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=1200&h=400&fit=crop') center/cover;
            color: white;
            padding: 72px 48px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.85) 0%, rgba(139, 92, 246, 0.75) 50%, rgba(245, 158, 11, 0.65) 100%);
            z-index: 0;
        }

        .header h1,
        .header p {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.75rem;
            font-weight: 900;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            letter-spacing: -1.5px;
        }

        .header h1 span {
            font-size: 4.5rem;
            filter: drop-shadow(0 4px 16px rgba(255, 255, 255, 0.4));
        }

        .header p {
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: 0.025em;
            opacity: 0.95;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Progress Bar */
        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 48px 64px;
            background: var(--bg-tertiary);
            position: relative;
            border-bottom: 1px solid var(--border-color);
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 64px;
            right: 64px;
            height: 2px;
            background: var(--border-color);
            z-index: 1;
            transform: translateY(-50%);
        }

        .step {
            position: relative;
            z-index: 2;
            text-align: center;
            flex: 1;
            cursor: pointer;
            transition: var(--transition-base);
        }

        .step-circle {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-full);
            background: white;
            border: 2px solid var(--border-color);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--text-muted);
            transition: var(--transition-base);
            box-shadow: var(--shadow-sm);
        }

        .step.active .step-circle {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            border-color: var(--primary-color);
            color: white;
            transform: scale(1.1);
            box-shadow: var(--shadow-glow);
        }

        .step.completed .step-circle {
            background: linear-gradient(135deg, var(--success-color) 0%, #059669 100%);
            border-color: var(--success-color);
            color: white;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.5);
        }

        .step-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.025em;
            transition: var(--transition-base);
        }

        .step.active .step-label {
            color: var(--primary-color);
            font-weight: 600;
        }

        .step.completed .step-label {
            color: var(--success-color);
        }

        /* Content Area */
        .content {
            padding: 60px 50px;
            background: transparent;
            position: relative;
        }

        /* Form Elements */
        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        input[type="time"],
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1em;
            transition: var(--transition-base);
            background: white;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            background: white;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        /* Buttons */
        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            padding: 14px 35px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-base);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success-color) 0%, #059669 100%);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading Spinner */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Itinerary View */
        .itinerary-view {
            display: none;
        }

        .itinerary-view.active {
            display: block;
        }

        /* Budget Overview View */
        .budget-overview-view {
            display: none;
        }

        .budget-overview-view.active {
            display: block;
        }

.day-card {
    background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
    border: 2px solid #e2e8f0;
    border-radius: 20px;
    padding: clamp(15px, 4vw, 30px);
    margin-bottom: clamp(20px, 4vw, 30px);
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    max-width: 100%;
    box-sizing: border-box;
    overflow: hidden;
}

.day-card:hover {
    box-shadow: 0 10px 30px rgba(37, 99, 235, 0.15);
    transform: translateY(-5px);
    border-color: var(--primary-color);
}

.day-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 2px solid #f1f5f9;
}

.day-title {
    font-size: 1.6em;
    font-weight: 800;
    color: #000000;
}

.activities-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.activity-card {
    background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
    border: 2px solid #bae6fd;
    border-radius: 15px;
    padding: clamp(15px, 3vw, 25px);
    display: flex;
    flex-wrap: wrap;
    gap: clamp(10px, 3vw, 20px);
    align-items: start;
    transition: all 0.3s ease;
    max-width: 100%;
    box-sizing: border-box;
    overflow: hidden;
}

.activity-card:hover {
    background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
    border-color: var(--primary-color);
    transform: translateX(5px);
    box-shadow: 0 5px 15px rgba(37, 99, 235, 0.2);
}

.activity-time {
    background: linear-gradient(135deg, var(--primary-color), #3b82f6);
    color: white;
    padding: clamp(8px, 2vw, 10px) clamp(12px, 3vw, 18px);
    border-radius: 10px;
    font-weight: 700;
    min-width: clamp(70px, 15vw, 90px);
    text-align: center;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    font-size: clamp(0.9em, 2.5vw, 1.05em);
    flex-shrink: 0;
}

.activity-details {
    flex: 1;
    min-width: 0;
    overflow: hidden;
}

.activity-name {
    font-size: clamp(1em, 3vw, 1.2em);
    font-weight: 700;
    color: #000000;
    margin-bottom: 10px;
    word-wrap: break-word;
    overflow-wrap: break-word;
    word-break: break-word;
}

.activity-meta {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(10px, 3vw, 25px);
    color: #1f2937;
    font-size: clamp(0.85em, 2vw, 0.95em);
    font-weight: 600;
}

.activity-meta span {
    display: flex;
    align-items: center;
    gap: 6px;
}

.activity-actions {
    display: flex;
    gap: clamp(8px, 2vw, 12px);
    flex-shrink: 0;
}


.icon-btn {
    width: 40px;
    height: 40px;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    background: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    color: #1f2937;
}

.icon-btn:hover {
    background: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
    transform: scale(1.1);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
}
        /* Add Activity Button */
      .add-activity-btn {
    width: 100%;
    padding: 15px;
    border: 2px dashed #2563eb;
    background: #f0f9ff;
    border-radius: 10px;
    color: #000000;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 1em;
    margin-top: 15px;
    font-weight: 700;
}

        .add-activity-btn:hover {
    border-color: #1e40af;
    color: #ffffff;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
}

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        /* Navigation Bar Buttons */
        .navigation-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .nav-btn {
            padding: 12px 25px;
            border: 2px solid var(--primary-color);
            border-radius: var(--radius-md);
            background: white;
            color: var(--primary-color);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-base);
            font-family: 'Inter', sans-serif;
        }

        .nav-btn:hover {
            background: var(--primary-light);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            box-shadow: var(--shadow-glow);
            border-color: var(--primary-color);
        }

        /* Modal Content */
        .modal-content {
            background: #f0f9ff;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #2563eb;
            box-shadow: 0 10px 40px rgba(37, 99, 235, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header .modal-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #1e40af;
        }

        .close-btn {
            width: 30px;
            height: 30px;
            border: none;
            background: #2563eb;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #1e40af;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
        }

        /* Form Inputs inside modal */
        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #2563eb;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: white;
            color: #0f172a;
        }

        .modal-content input:focus,
        .modal-content select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* Action buttons at the bottom of itinerary */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin: 40px 0;
        }

        .action-buttons .btn {
            flex: 1 1 200px;
            text-align: center;
        }

        /* Alerts */
        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background: rgba(76, 175, 80, 0.2);
            border-left: 4px solid #4caf50;
            color: #81c784;
        }

        /* ===== BUDGET OVERVIEW STYLES ===== */

        /* Budget Summary Header */
        .budget-summary-header {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
    border: 2px solid #e2e8f0;
    border-radius: 20px;
    padding: 40px;
    margin-bottom: 30px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .budget-summary-header h2 {
             color: #0f172a;
    font-size: 2.5em;
    margin-bottom: 15px;
    font-weight: 800;
        }

        .budget-total {
            font-size: 4em;
    font-weight: 900;
    background: linear-gradient(135deg, var(--primary-color), #3b82f6);
    -webkit-background-clip: text;
    
    -webkit-text-fill-color: transparent;
    margin: 25px 0;
        }

        /* Budget Stats Grid */
        .budget-stats-grid {
            display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-top: 30px;
}
        .budget-stat-card {
           background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    border: 2px solid #bae6fd;
    transition: all 0.3s ease;
        }

        .budget-stat-label {
           color: #334155;
    font-size: 0.95em;
    margin-bottom: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
        .budget-stat-value {
             color: var(--primary-color);
    font-size: 2em;
    font-weight: 800;
        }

        /* Budget Category Cards */
    .budget-category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 25px;
    margin-bottom: 30px;
}

.budget-category-card {
    background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
    border: 2px solid #e2e8f0;
    border-radius: 20px;
    padding: 30px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
}

.budget-category-card:hover {
    border-color: var(--primary-color);
    box-shadow: 0 10px 30px rgba(37, 99, 235, 0.15);
    transform: translateY(-5px);
}

.budget-category-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 2px solid #f1f5f9;
   
}

.budget-category-title {
   display: flex;
    flex-direction: column;
    gap: 10px;
   
}

.budget-category-icon {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5em;
    color: white;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
}

.budget-category-name {
    font-size: 1.4em;
    font-weight: 700;
    color: #0f172a;
}

.budget-category-total {
     font-size: 1.5em;
    font-weight: 900;
    background: linear-gradient(135deg, var(--primary-color), #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-left: 65px;
    
}

.budget-category-items {
    list-style: none;
}

.budget-category-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid #f1f5f9;
    color: #334155;
}

.budget-category-item:last-child {
    border-bottom: none;
}

.budget-item-name {
    font-weight: 600;
}

.budget-item-value {
    font-weight: 700;
    color: #0f172a;
    font-size: 1em;
    word-break: break-word;
    text-align: right;
}
        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 2.5rem;
                flex-direction: column;
                gap: 10px;
            }

    <script>
        let currentStep = 4;
        let tripData;
        let itineraryData;
        let budgetData;
        let editingDayIndex = null;
        let editingActivityIndex = null;

        // Initialize loading screen
        document.addEventListener('DOMContentLoaded', function () {
            const content = document.querySelector('.content');
            content.innerHTML = `
                <div class="navigation-bar">
                    <button class="nav-btn" onclick="showBudgetOverview()">Budget Overview</button>
                    <button class="nav-btn active" onclick="showItinerary()">Day-by-Day Itinerary</button>
                </div>
                <div class="loading">
                    <div class="spinner"></div>
                    <h3>Finalizing Your Itinerary...</h3>
                    <p>Personalizing activities and crafting the perfect schedule</p>
                </div>
            `;

            setTimeout(generateAndDisplay, 2500);
        });

        function generateAndDisplay() {
            tripData = JSON.parse(sessionStorage.getItem('tripData'));
            budgetData = JSON.parse(sessionStorage.getItem('budgetData'));

            if (!tripData) {
                alert('Trip data not found. Redirecting to start.');
                window.location.href = 'itinerary.html';
                return;
            }

            itineraryData = calculateItinerary();
            const content = document.querySelector('.content');
            content.innerHTML = `
                <div class="navigation-bar">
                    <button class="nav-btn" onclick="showBudgetOverview()">Budget Overview</button>
                    <button class="nav-btn active" onclick="showItinerary()">Day-by-Day Itinerary</button>
                </div>
                
                <!-- Budget Overview Section -->
                <div class="budget-overview-view" id="budgetOverviewView">
                    <div id="budgetOverviewContent"></div>
                </div>

                <!-- Itinerary Section -->
                <div class="itinerary-view active" id="itineraryView">
                    <div id="itineraryContent"></div>
                </div>
            `;

            displayItinerary();
            displayBudgetOverview();
            updateStepDisplay();
            attachModalListeners();
        }

        // Toggle between Budget Overview and Itinerary
        function showBudgetOverview() {
            document.getElementById('budgetOverviewView').classList.add('active');
            document.getElementById('itineraryView').classList.remove('active');

            // Update nav buttons
            const navBtns = document.querySelectorAll('.nav-btn');
            navBtns[0].classList.add('active');
            navBtns[1].classList.remove('active');
        }

        function showItinerary() {
            document.getElementById('itineraryView').classList.add('active');
            document.getElementById('budgetOverviewView').classList.remove('active');

            // Update nav buttons
            const navBtns = document.querySelectorAll('.nav-btn');
            navBtns[0].classList.remove('active');
            navBtns[1].classList.add('active');
        }

        // Display Budget Overview
        function displayBudgetOverview() {
            const content = document.getElementById('budgetOverviewContent');

            if (!budgetData || budgetData.noData) {
                content.innerHTML = `
                    <div class="budget-summary-header">
                        <h2>No Budget Data Available</h2>
                        <p style="color: rgba(255,255,255,0.7); margin-top: 15px;">Please calculate your budget first from the calculator page.</p>
                    </div>
                `;
                return;
            }

            const summary = budgetData.summary;
            const currency = summary.currency;
            const tripInfo = budgetData.tripInfo || {};
            const travelersText = summary.travelers === 1 ? '1 Traveler' : `${summary.travelers} Travelers`;

            let html = `
                <div class="budget-summary-header">
                    <h2>Your Travel Budget Summary</h2>
                    ${tripInfo.destination ? `<p style="color: var(--primary-color); font-size: 1.5em; margin-top: 10px;">${tripInfo.destination}</p>` : ''}
                    <div class="budget-total">${currency}${summary.total.toFixed(2)}</div>
                    
                    <div class="budget-stats-grid">
                        <div class="budget-stat-card">
                            <div class="budget-stat-label">Daily Average</div>
                            <div class="budget-stat-value">${currency}${summary.dailyAvg.toFixed(2)}</div>
                        </div>
                        <div class="budget-stat-card">
                            <div class="budget-stat-label">Per Person</div>
                            <div class="budget-stat-value">${currency}${summary.perPerson.toFixed(2)}</div>
                        </div>
                        <div class="budget-stat-card">
                            <div class="budget-stat-label">Duration</div>
                            <div class="budget-stat-value">${summary.duration} day${summary.duration !== 1 ? 's' : ''}</div>
                        </div>
                        <div class="budget-stat-card">
                            <div class="budget-stat-label">Travelers</div>
                            <div class="budget-stat-value">${travelersText}</div>
                        </div>
                    </div>
                </div>

                <h3 style="margin: 30px 0 20px; font-size: 1.5em; color: #000000; text-align: center;">💰 Budget Breakdown by Category</h3>

                <div class="budget-category-grid">
                    ${createBudgetCategoryCard('Transportation', '✈️', budgetData.transportation, currency, '#2563eb', [
                { name: 'Flights', value: budgetData.transportation.flights },
                { name: 'Local Transport', value: budgetData.transportation.localTransport },
                { name: 'Car Rental', value: budgetData.transportation.carRental }
            ])}

                    ${createBudgetCategoryCard('Accommodation', '🏨', budgetData.accommodation, currency, '#10b981', [
                { name: 'Hotel/Hostel', value: budgetData.accommodation.hotel },
                { name: 'Airbnb', value: budgetData.accommodation.airbnb },
                { name: 'Other', value: budgetData.accommodation.otherAccom }
            ])}

                    ${createBudgetCategoryCard('Food & Dining', '🍽️', budgetData.food, currency, '#f59e0b', [
                { name: 'Meals', value: budgetData.food.meals },
                { name: 'Snacks & Drinks', value: budgetData.food.snacks },
                { name: 'Groceries', value: budgetData.food.groceries }
            ])}

                    ${createBudgetCategoryCard('Activities', '🎫', budgetData.activities, currency, '#8b5cf6', [
                { name: 'Tours', value: budgetData.activities.tours },
                { name: 'Attractions', value: budgetData.activities.attractions },
                { name: 'Entertainment', value: budgetData.activities.entertainment }
            ])}

                    ${createBudgetCategoryCard('Shopping', '🛍️', budgetData.shopping, currency, '#ec4899', [
                { name: 'Souvenirs', value: budgetData.shopping.souvenirs },
                { name: 'Clothes', value: budgetData.shopping.clothes },
                { name: 'Other', value: budgetData.shopping.otherShopping }
            ])}

                    ${createBudgetCategoryCard('Miscellaneous', '📋', budgetData.miscellaneous, currency, '#6366f1', [
                { name: 'Insurance', value: budgetData.miscellaneous.insurance },
                { name: 'Visa/Documents', value: budgetData.miscellaneous.visa },
                { name: 'Emergency Fund', value: budgetData.miscellaneous.emergency }
            ])}
                </div>
            `;

            content.innerHTML = html;
        }

        function createBudgetCategoryCard(title, icon, categoryData, currency, color, items) {
            if (!categoryData || categoryData.total === 0) return '';

            const itemsHTML = items
                .filter(item => item.value > 0)
                .map(item => `
                    <li class="budget-category-item">
                        <span class="budget-item-name">${item.name}</span>
                        <span class="budget-item-value">${currency}${item.value.toFixed(2)}</span>
                    </li>
                `).join('');

            return `
                 <div class="budget-category-card">
        <div class="budget-category-header">
            <div class="budget-category-title">
                <div class="budget-category-icon-wrapper">
                    <div class="budget-category-icon" style="background: ${color}">
                        ${icon}
                    </div>
                    <span class="budget-category-name">${title}</span>
                </div>
                <div class="budget-category-total">${currency}${categoryData.total.toFixed(2)}</div>
            </div>
        </div>
        ${itemsHTML ? `<ul class="budget-category-items">${itemsHTML}</ul>` : ''}
    </div>
`;
        }

        function calculateItinerary() {
            const startDate = new Date(tripData.startDate);
            const endDate = new Date(tripData.endDate);
            const days = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;

            const activitiesPerDay = {
                'relaxed': 4,
                'moderate': 6,
                'intensive': 8
            };

            const activityTemplates = {
                'culture': [
                    { name: 'Historical Walking Tour', time: '09:00', duration: 3 },
                    { name: 'Local Market Visit', time: '15:00', duration: 2 },
                    { name: 'Cultural Museum', time: '10:00', duration: 2.5 }
                ],
                'nature': [
                    { name: 'Morning Hike', time: '07:00', duration: 4 },
                    { name: 'Botanical Garden', time: '14:00', duration: 2 },
                    { name: 'Sunset Viewpoint', time: '17:30', duration: 1.5 }
                ],
                'food': [
                    { name: 'Local Breakfast Spot', time: '08:00', duration: 1 },
                    { name: 'Street Food Tour', time: '12:00', duration: 2 },
                    { name: 'Traditional Dinner', time: '19:00', duration: 2 }
                ],
                'shopping': [
                    { name: 'Local Artisan Market', time: '11:00', duration: 2 },
                    { name: 'Shopping District', time: '15:00', duration: 3 }
                ],
                'nightlife': [
                    { name: 'Evening Entertainment', time: '20:00', duration: 3 }
                ],
                'museums': [
                    { name: 'Art Gallery Visit', time: '10:00', duration: 2 },
                    { name: 'Science Museum', time: '14:00', duration: 2.5 }
                ],
                'beaches': [
                    { name: 'Beach Activities', time: '10:00', duration: 3 },
                    { name: 'Sunset Beach Walk', time: '18:00', duration: 1.5 }
                ],
                'photography': [
                    { name: 'Photography Spots Tour', time: '06:00', duration: 3 }
                ]
            };

            const itinerary = [];
            const numActivities = activitiesPerDay[tripData.travelStyle];

            for (let i = 0; i < days; i++) {
                const currentDate = new Date(startDate);
                currentDate.setDate(startDate.getDate() + i);

                const dayActivities = [];
                let selectedInterests = [...tripData.interests];

                dayActivities.push({
                    name: 'Breakfast',
                    time: '08:00',
                    duration: 1,
                    location: tripData.destination
                });

                let activitiesAdded = 1;
                while (activitiesAdded < numActivities && selectedInterests.length > 0) {
                    const interestIndex = Math.floor(Math.random() * selectedInterests.length);
                    const interest = selectedInterests[interestIndex];

                    if (activityTemplates[interest]) {
                        const templates = activityTemplates[interest];
                        const template = templates[Math.floor(Math.random() * templates.length)];
                        dayActivities.push({
                            name: template.name,
                            time: template.time,
                            duration: template.duration,
                            location: tripData.destination
                        });
                        activitiesAdded++;
                    }
                    selectedInterests.splice(interestIndex, 1);
                }

                dayActivities.push({
                    name: 'Lunch',
                    time: '13:00',
                    duration: 1,
                    location: tripData.destination
                });
                dayActivities.push({
                    name: 'Dinner',
                    time: '19:30',
                    duration: 1.5,
                    location: tripData.destination
                });

                dayActivities.sort((a, b) => a.time.localeCompare(b.time));

                itinerary.push({
                    day: i + 1,
                    date: currentDate.toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }),
                    activities: dayActivities
                });
            }

            return {
                destination: tripData.destination,
                days,
                travelers: tripData.travelers,
                itinerary
            };
        }

        function displayItinerary() {
            const content = document.getElementById('itineraryContent');
            const travelersText = itineraryData.travelers === 1 ? '1 person' : `${itineraryData.travelers} persons`;

            let html = `
                <h3 style="margin: 30px 0 20px; font-size: 1.5em; color: white;">📅 Day-by-Day Itinerary (${itineraryData.days} Days)</h3>
            `;

            itineraryData.itinerary.forEach((day, dayIndex) => {
                html += `
                    <div class="day-card">
                        <div class="day-header">
                            <div>
                                <div class="day-title">Day ${day.day}</div>
                                <div style="color: rgba(255, 255, 255, 0.6); font-size: 0.9em;">${day.date}</div>
                            </div>
                        </div>
                        <div class="activities-list">
                `;

                day.activities.forEach((activity, actIndex) => {
                    html += `
                        <div class="activity-card">
                            <div class="activity-time">${activity.time}</div>
                            <div class="activity-details">
                                <div class="activity-name">${activity.name}</div>
                                <div class="activity-meta">
                                    <span>⏱ ${activity.duration} hrs</span>
                                    <span>👥 ${travelersText}</span>
                                    <span>📍 ${activity.location}</span>
                                </div>
                            </div>
                            <div class="activity-actions">
                                <button class="icon-btn" onclick="editActivity(${dayIndex}, ${actIndex})" title="Edit Activity">✏</button>
                                <button class="icon-btn" onclick="deleteActivity(${dayIndex}, ${actIndex})" title="Delete">🗑</button>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                        <button class="add-activity-btn" onclick="addActivity(${dayIndex})">
                            ➕ Add New Activity
                        </button>
                    </div>
                `;
            });

            html += `
                <div class="action-buttons">
                    <button class="btn btn-success" onclick="openSaveTripModal()">💾 Save Trip Plan</button>
                    <button class="btn btn-secondary" onclick="location.reload()">🔄 Regenerate</button>
                    <button class="btn btn-secondary" onclick="window.location.href='itinerary.html'">🏠 New Trip</button>
                </div>
            `;

            content.innerHTML = html;
        }

        // Modal functions
        function addActivity(dayIndex) {
            editingDayIndex = dayIndex;
            editingActivityIndex = null;
            document.getElementById('modalTitle').textContent = 'Add New Activity';
            document.getElementById('activityForm').reset();
            document.getElementById('activityLocation').value = itineraryData.destination;
            document.getElementById('activityModal').classList.add('active');
        }

        function editActivity(dayIndex, actIndex) {
            editingDayIndex = dayIndex;
            editingActivityIndex = actIndex;
            const act = itineraryData.itinerary[dayIndex].activities[actIndex];
            document.getElementById('modalTitle').textContent = 'Edit Activity';
            document.getElementById('activityName').value = act.name;
            document.getElementById('activityTime').value = act.time;
            document.getElementById('activityDuration').value = act.duration;
            document.getElementById('activityLocation').value = act.location;
            document.getElementById('activityModal').classList.add('active');
        }

        function deleteActivity(dayIndex, actIndex) {
            if (confirm('Delete this activity?')) {
                itineraryData.itinerary[dayIndex].activities.splice(actIndex, 1);
                displayItinerary();
            }
        }

        function closeModal() {
            document.getElementById('activityModal').classList.remove('active');
        }

        function attachModalListeners() {
            const modal = document.getElementById('activityModal');
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            document.getElementById('activityForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const activity = {
                    name: document.getElementById('activityName').value,
                    time: document.getElementById('activityTime').value,
                    duration: parseFloat(document.getElementById('activityDuration').value),
                    location: document.getElementById('activityLocation').value || itineraryData.destination
                };
                const day = itineraryData.itinerary[editingDayIndex];
                if (editingActivityIndex !== null) {
                    day.activities[editingActivityIndex] = activity;
                } else {
                    day.activities.push(activity);
                    day.activities.sort((a, b) => a.time.localeCompare(b.time));
                }
                closeModal();
                displayItinerary();
            });
        }

        // Save Trip Functions
        function openSaveTripModal() {
            document.getElementById('saveTripModal').classList.add('active');
            document.getElementById('saveSuccessAlert').style.display = 'none';
            document.getElementById('tripName').value = `${itineraryData.destination} Trip - ${new Date().toLocaleDateString()}`;
        }

        function closeSaveTripModal() {
            document.getElementById('saveTripModal').classList.remove('active');
        }

        document.getElementById('saveTripForm').addEventListener('submit', function (e) {
            e.preventDefault();
            saveTripPlan();
        });

      function saveTripPlan() {
    const tripName = document.getElementById('tripName').value;
    
    // Get current user ID
    const userId = localStorage.getItem('userId');
    if (!userId) {
        alert('Please login to save trips');
        window.location.href = 'login.php';
        return;
    }

    const tripPlan = {
        id: Date.now().toString(),
        userId: userId,  // Associate trip with user
        name: tripName,
        savedDate: new Date().toISOString(),
        tripData: tripData,
        itineraryData: itineraryData
    };

    let savedTrips = JSON.parse(localStorage.getItem('savedTripPlans')) || [];
    savedTrips.unshift(tripPlan);
    localStorage.setItem('savedTripPlans', JSON.stringify(savedTrips));

    document.getElementById('saveSuccessAlert').style.display = 'flex';

    setTimeout(() => {
        closeSaveTripModal();
        if (confirm('Trip saved successfully! Would you like to view your saved trips in the dashboard?')) {
            window.location.href = 'dashboard.html';
        }
    }, 2000);
}
        function updateStepDisplay() {
            document.querySelectorAll('.step').forEach(step => {
                const num = parseInt(step.dataset.step);
                step.classList.toggle('completed', num < currentStep);
                step.classList.toggle('active', num === currentStep);
            });
        }

        document.getElementById('saveTripModal').addEventListener('click', function (e) {
            if (e.target === this) closeSaveTripModal();
        });
        
// Mobile Menu Toggle
const mobileMenu = document.getElementById('mobile-menu');
const navMenu = document.querySelector('.nav-menu');

if (mobileMenu) {
    mobileMenu.addEventListener('click', function() {
        this.classList.toggle('active');
        navMenu.classList.toggle('active');
    });
}

// Close mobile menu when clicking outside
document.addEventListener('click', function(event) {
    const isClickInsideMenu = navMenu.contains(event.target);
    const isClickOnToggle = mobileMenu.contains(event.target);
    
    if (!isClickInsideMenu && !isClickOnToggle && navMenu.classList.contains('active')) {
        mobileMenu.classList.remove('active');
        navMenu.classList.remove('active');
    }
});

// Close mobile menu when clicking on a link
document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', () => {
        mobileMenu.classList.remove('active');
        navMenu.classList.remove('active');
    });
});

// Add scrolled class to header on scroll
window.addEventListener('scroll', function() {
    const header = document.querySelector('.header-nav');
    if (window.scrollY > 50) {
        header.classList.add('scrolled');
    } else {
        header.classList.remove('scrolled');
    }
});

// Highlight active nav link based on current page
const currentPage = window.location.pathname.split('/').pop() || 'index.html';
document.querySelectorAll('.nav-link').forEach(link => {
    const linkPage = link.getAttribute('href').split('/').pop().split('#')[0];
    if (linkPage === currentPage) {
        link.classList.add('active');
    }
});
