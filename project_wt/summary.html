<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=yes">
    <meta name="description" content="Budget Summary - View your travel budget breakdown">
    <title>Budget Summary - TripBudget Planner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* ✅ WCAG 2.1 UPDATED: All colors now meet 4.5:1 contrast ratio */
            --primary-color: #1d4ed8;
            /* UPDATED from #2563eb - Ratio: 5.14:1 */
            --primary-dark: #1e40af;
            /* UPDATED from #1d4ed8 - Better contrast */
            --secondary-color: #047857;
            /* UPDATED from #10b981 - Ratio: 4.52:1 */
            --accent-color: #b45309;
            /* UPDATED from #f59e0b - Ratio: 4.58:1 */
            --dark-color: #1f2937;
            /* Same - Already compliant - Ratio: 14.55:1 */
            --light-color: #f3f4f6;
            /* Same */
            --white: #ffffff;
            /* Same */
            --text-color: #374151;
            /* Same - Already compliant - Ratio: 10.73:1 */
            --border-color: #e5e7eb;
            /* Same */
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s ease;

            --min-font-body: 14px;
            --min-font-heading: 20px;
            --min-font-subheading: 16px;
            --min-font-button: 14px;
        }

        html {
            min-width: 320px;
            overflow-x: auto;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
            min-width: 320px;
            overflow-x: auto;
        }

        .page-wrapper {
            min-width: 320px;
            width: 100%;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            z-index: -1;
            min-width: 320px;
        }

        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--primary-color);
            color: var(--white);
            padding: 8px 16px;
            text-decoration: none;
            z-index: 100;
            border-radius: 0 0 4px 0;
            font-weight: 600;
        }

        .skip-link:focus {
            top: 0;
            outline: 3px solid var(--white);
            outline-offset: 2px;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            animation: slideDown 0.5s ease;
            min-width: 320px;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-width: 320px;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 1.75rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .logo i {
            margin-right: 0.75rem;
            font-size: 2rem;
            color: var(--primary-color);
        }

        .menu-toggle {
            display: none;
            background: none;
            border: 2px solid var(--primary-color);
            font-size: 1.5rem;
            color: var(--primary-color);
            cursor: pointer;
            padding: 0.5rem;
            transition: var(--transition);
            border-radius: 4px;
        }

        .menu-toggle:hover,
        .menu-toggle:focus {
            color: var(--white);
            background: var(--primary-color);
            transform: scale(1.05);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 3rem;
        }

        .nav-menu a {
            text-decoration: none;
            color: var(--dark-color);
            font-weight: 500;
            font-size: 1.1rem;
            position: relative;
            transition: var(--transition);
            padding: 0.5rem 1rem;
        }

        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            transition: var(--transition);
            transform: translateX(-50%);
        }

        .nav-menu a:hover::after,
        .nav-menu a:focus::after,
        .nav-menu a[aria-current="page"]::after {
            width: 80%;
        }

        .nav-menu a:focus {
            outline: 3px solid var(--primary-color);
            outline-offset: 4px;
            border-radius: 4px;
        }

        .summary-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            animation: fadeIn 0.8s ease;
            min-width: 290px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .summary-header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 3rem;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.95));
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            min-width: 260px;
        }

        .summary-header h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .total-budget {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: bold;
            margin: 2rem 0;
            color: var(--primary-color);
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            padding: 1.5rem;
            border-radius: 15px;
            text-align: center;
            color: var(--white);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: bold;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 350px), 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: var(--transition);
            border: 2px solid var(--border-color);
        }

        .category-card:hover,
        .category-card:focus-within {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.18);
            border-color: var(--primary-color);
        }

        .category-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--light-color);
            gap: 1rem;
        }

        .category-title {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--dark-color);
            flex: 1 1 auto;
            min-width: 150px;
        }

        .category-icon {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 1.3rem;
            color: var(--white);
            flex-shrink: 0;
        }

        .category-total {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-all;
            white-space: normal;
            text-align: right;
            line-height: 1.3;
            flex: 0 1 auto;
            min-width: 100px;
            max-width: 100%;
        }

        .category-items {
            list-style: none;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.875rem 0;
            border-bottom: 1px solid var(--light-color);
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .category-item:last-child {
            border-bottom: none;
        }

        .item-name {
            color: var(--text-color);
            font-weight: 500;
            flex: 1 1 auto;
            min-width: 100px;
        }

        .item-value {
            font-weight: 600;
            color: var(--dark-color);
            word-break: break-all;
            text-align: right;
        }

        .no-data {
            text-align: center;
            padding: 5rem 2rem;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            max-width: 600px;
            margin: 4rem auto;
            min-width: 260px;
        }

        .no-data-icon {
            font-size: 5rem;
            color: var(--accent-color);
            /* Now using compliant accent color */
            margin-bottom: 1.5rem;
        }

        .no-data h2 {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            color: var(--dark-color);
            margin-bottom: 1rem;
        }

        .no-data p {
            font-size: 1.2rem;
            color: var(--text-color);
            margin-bottom: 2rem;
        }

        .action-buttons {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 3rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1.25rem 3rem;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: var(--white);
            box-shadow: 0 5px 20px rgba(37, 99, 235, 0.35);
        }

        .btn-primary:hover,
        .btn-primary:focus {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.45);
        }

        /* ✅ WCAG 2.1 UPDATED: Secondary button with compliant green */
        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary-color), #065f46);
            color: var(--white);
            box-shadow: 0 5px 20px rgba(4, 120, 87, 0.35);
        }

        .btn-secondary:hover,
        .btn-secondary:focus {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(4, 120, 87, 0.45);
        }

        .btn:focus {
            outline: 3px solid var(--dark-color);
            outline-offset: 4px;
        }

        footer {
            background: linear-gradient(135deg, var(--dark-color), #111827);
            color: var(--white);
            text-align: center;
            padding: 3rem 2rem;
            margin-top: 4rem;
            border-radius: 25px 25px 0 0;
            font-size: 1.1rem;
            min-width: 320px;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .nav-menu {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(255, 255, 255, 0.98);
                backdrop-filter: blur(10px);
                flex-direction: column;
                padding: 1rem;
                box-shadow: var(--shadow);
                transform: translateY(-100%);
                opacity: 0;
                visibility: hidden;
                transition: var(--transition);
                gap: 1rem;
                min-width: 320px;
            }

            .nav-menu.active {
                transform: translateY(0);
                opacity: 1;
                visibility: visible;
            }

            .summary-container {
                padding: 0 1rem;
            }

            .summary-header {
                padding: 2rem 1.5rem;
            }

            .category-grid {
                grid-template-columns: 1fr;
            }

            .category-header {
                flex-direction: row;
                align-items: flex-start;
            }

            .category-total {
                flex: 0 1 auto;
                max-width: 45%;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
                padding: 1rem 2rem;
            }
        }

        @media (max-width: 400px) {
            .category-header {
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 0.75rem !important;
            }

            .category-title {
                width: 100% !important;
            }

            .category-total {
                width: 100% !important;
                max-width: 100% !important;
                text-align: left !important;
                margin-top: 0 !important;
                display: block !important;
                font-size: 1.3rem !important;
            }
        }

        @media (max-width: 320px) {

            html,
            body {
                min-width: 320px !important;
                overflow-x: auto !important;
            }

            body {
                font-size: var(--min-font-body) !important;
            }

            .nav-container {
                padding: 0.75rem;
                min-width: 320px;
            }

            .logo {
                font-size: var(--min-font-subheading) !important;
            }

            .logo i {
                font-size: 1.5rem !important;
                margin-right: 0.5rem;
            }

            .summary-container {
                width: 320px !important;
                min-width: 320px !important;
                max-width: 320px !important;
                margin: 1rem auto;
                padding: 0 10px !important;
                overflow-x: auto;
            }

            .summary-header {
                width: calc(100% - 20px) !important;
                min-width: 280px !important;
                padding: 20px 15px !important;
                margin-bottom: 1.5rem;
                border-radius: 15px;
            }

            .summary-header h1 {
                font-size: var(--min-font-heading) !important;
                margin-bottom: 1rem;
                line-height: 1.3 !important;
            }

            .summary-header h2 {
                font-size: var(--min-font-subheading) !important;
                line-height: 1.4 !important;
            }

            .summary-header p {
                font-size: var(--min-font-body) !important;

            }

            }

            }

                gap: 1rem;

            }

            .category-card {

                border-radius: 12px;

            }

            .category-header {
                flex-direction: column !important;
                align-items: flex-start !important;

            }

            .category-title {
                gap: 0.5rem;
                font-size: var(--min-font-subheading) !important;
                width: 100% !important;
                min-width: unset !important;
            }

            .category-title h3 {
                font-size: var(--min-font-subheading) !important;
            }

            .category-icon {
                width: 35px !important;

            }

                text-align: left !important;
                margin-top: 0 !important;
                word-wrap: break-word !important;
                overflow-wrap: break-word !important;
                word-break: break-all !important;

                display: block !important;
            }

                width: 100%;
            }

            .category-item {
                padding: 0.65rem 0;
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 0.25rem;
            }

            .item-name {
                font-size: var(--min-font-body) !important;

            }

            }

            .no-data {
                width: calc(100% - 20px) !important;
                min-width: 280px !important;

            }

                font-size: var(--min-font-body) !important;

            .btn {

                margin-top: 2rem;

                font-size: var(--min-font-subheading) !important;
                margin-bottom: 1.5rem !important;
            }

        @media (max-width: 319px) {

            html,
            body {
                width: 320px !important;
                min-width: 320px !important;
                overflow-x: auto !important;
            }

            .page-wrapper {
                width: 320px !important;
                min-width: 320px !important;
            }

            .summary-container {
                width: 320px !important;
                min-width: 320px !important;
            }

            .summary-header,
            .no-data {
                min-width: 280px !important;
            }

        @media print {

            .navbar,
            .action-buttons,
            footer,
            .skip-link {
                display: none;
            }

            .summary-container {
                max-width: 100%;

                break-inside: avoid;
                border: 1px solid #000;
            }

            body {
                background: white;
            }

            body::before {
                display: none;
            }
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        *:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: 3px;
        }

        @media (prefers-contrast: high) {
            .category-card {
                border: 3px solid var(--dark-color);
            }

            .btn {
                border: 2px solid var(--dark-color);
            }

            *,

<body>
    <div class="page-wrapper">
        <a href="#main-content" class="skip-link">Skip to main content</a>

        <nav class="navbar" role="navigation" aria-label="Main navigation">
            <div class="nav-container">
                <div class="logo" role="img" aria-label="TripBudget Planner">
                    <span>Planora</span>
                </div>
                <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="navMenu"
                    aria-label="Toggle navigation menu">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
                <ul class="nav-menu" id="navMenu">
                    <li><a href="index.html">Home</a></li>
                </ul>
            </div>
        </nav>

        <main id="main-content" class="summary-container">
            <div id="summaryContent" role="region" aria-live="polite" aria-atomic="true">
                <div style="text-align: center; padding: 3rem;">
                    <i class="fas fa-spinner fa-spin" style="font-size: 3rem; color: var(--primary-color);"
                        aria-hidden="true"></i>
                    <p class="sr-only">Loading budget summary...</p>
                </div>
            </div>
        </main>

        <footer role="contentinfo">
            <p>&copy; 2025 TripBudget Planner. Plan Smarter, Travel Better.</p>
        </footer>
    </div>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');

        if (menuToggle) {
            menuToggle.addEventListener('click', function () {
                const isExpanded = navMenu.classList.toggle('active');
                menuToggle.setAttribute('aria-expanded', isExpanded);
            });

            document.addEventListener('click', function (event) {
                if (!event.target.closest('.nav-container')) {
                    navMenu.classList.remove('active');
                    menuToggle.setAttribute('aria-expanded', 'false');
                }
            });

            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && navMenu.classList.contains('active')) {
                    navMenu.classList.remove('active');
                    menuToggle.setAttribute('aria-expanded', 'false');
                    menuToggle.focus();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            const budgetDataStr = sessionStorage.getItem('budgetData');

            if (!budgetDataStr) {
                displayNoData();
                return;
            }

            const budgetData = JSON.parse(budgetDataStr);

            if (budgetData.noData) {
                displayNoData();
            } else {
                displayBudgetSummary(budgetData);
            }
        });

        function displayNoData() {
            const content = document.getElementById('summaryContent');
            content.innerHTML = `
                <div class="no-data">
                    <i class="fas fa-exclamation-circle no-data-icon" aria-hidden="true"></i>
                    <h2>No Data Found</h2>
                    <p>No budget data available. Please enter your expenses and calculate your budget first.</p>
                    <div class="action-buttons">
                        <a href="calculator.html" class="btn btn-primary" aria-label="Go to calculator to enter your budget">
                            <i class="fas fa-calculator" aria-hidden="true"></i>
                            <span>Go to Calculator</span>
                        </a>
                    </div>
                </div>
            `;
        }

        function displayBudgetSummary(data) {
            const summary = data.summary;
            const currency = summary.currency;
            const tripInfo = data.tripInfo || {};

            const travelersText = summary.travelers === 1 ? '1 Traveler' : `${summary.travelers} Travelers`;

            const content = document.getElementById('summaryContent');
            content.innerHTML = `
                <div class="summary-header">
                    <h1>Your Travel Budget Summary</h1>
                    ${tripInfo.destination ? `
                        <div style="margin-bottom: 1rem;">
                            <h2 style="color: var(--primary-color); font-size: clamp(1.2rem, 3vw, 1.8rem);">${tripInfo.destination}</h2>
                            ${tripInfo.startDate && tripInfo.endDate ?
                        `<p style="color: var(--text-color); font-size: clamp(0.9rem, 2vw, 1.1rem);">
                                    <time datetime="${tripInfo.startDate}">${new Date(tripInfo.startDate).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</time> - 
                                    <time datetime="${tripInfo.endDate}">${new Date(tripInfo.endDate).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</time>
                                </p>` : ''
                    }
                        </div>
                    ` : ''}
                    <div class="total-budget" role="status" aria-label="Total budget amount: ${currency}${summary.total.toFixed(2)}">
                        ${currency}${summary.total.toFixed(2)}
                    </div>
                    <div class="summary-stats" role="list" aria-label="Budget statistics">
                        <div class="stat-card" role="listitem">
                            <div class="stat-label">Daily Average</div>
                            <div class="stat-value" aria-label="Daily average: ${currency}${summary.dailyAvg.toFixed(2)}">${currency}${summary.dailyAvg.toFixed(2)}</div>
                        </div>
                        <div class="stat-card" role="listitem">
                            <div class="stat-label">Per Person</div>
                            <div class="stat-value" aria-label="Per person: ${currency}${summary.perPerson.toFixed(2)}">${currency}${summary.perPerson.toFixed(2)}</div>
                        </div>
                        <div class="stat-card" role="listitem">
                            <div class="stat-label">Duration</div>
                            <div class="stat-value" aria-label="Duration: ${summary.duration} day${summary.duration !== 1 ? 's' : ''}">${summary.duration} day${summary.duration !== 1 ? 's' : ''}</div>
                        </div>
                        <div class="stat-card" role="listitem">
                            <div class="stat-label">Travelers</div>
                            <div class="stat-value" aria-label="${travelersText}">${travelersText}</div>
                        </div>
                    </div>
                </div>

                <h2 style="text-align: center; margin-bottom: 2rem; color: var(--white); font-size: clamp(1.2rem, 4vw, 2.5rem); text-shadow: 0 2px 8px rgba(0,0,0,0.2);">
                    Budget Breakdown by Category
                </h2>

                <div class="category-grid">
                    ${createCategoryCard('Transportation', 'fa-plane', data.transportation, currency, '#1d4ed8', [
                        { name: 'Flights', value: data.transportation.flights },
                        { name: 'Local Transport', value: data.transportation.localTransport },
                        { name: 'Car Rental', value: data.transportation.carRental }
                    ])}

                    ${createCategoryCard('Accommodation', 'fa-hotel', data.accommodation, currency, '#047857', [
                        { name: 'Hotel/Hostel', value: data.accommodation.hotel },
                        { name: 'Airbnb', value: data.accommodation.airbnb },
                        { name: 'Other', value: data.accommodation.otherAccom }
                    ])}

                    ${createCategoryCard('Food & Dining', 'fa-utensils', data.food, currency, '#b45309', [
                        { name: 'Meals', value: data.food.meals },
                        { name: 'Snacks & Drinks', value: data.food.snacks },
                        { name: 'Groceries', value: data.food.groceries }
                    ])}

                    ${createCategoryCard('Activities', 'fa-ticket-alt', data.activities, currency, '#7c3aed', [
                        { name: 'Tours', value: data.activities.tours },
                        { name: 'Attractions', value: data.activities.attractions },
                        { name: 'Entertainment', value: data.activities.entertainment }
                    ])}

                    ${createCategoryCard('Shopping', 'fa-shopping-bag', data.shopping, currency, '#be185d', [
                        { name: 'Souvenirs', value: data.shopping.souvenirs },
                        { name: 'Clothes', value: data.shopping.clothes },
                        { name: 'Other', value: data.shopping.otherShopping }
                    ])}

                    ${createCategoryCard('Miscellaneous', 'fa-ellipsis-h', data.miscellaneous, currency, '#4f46e5', [
                        { name: 'Insurance', value: data.miscellaneous.insurance },
                        { name: 'Visa/Documents', value: data.miscellaneous.visa },
                        { name: 'Emergency Fund', value: data.miscellaneous.emergency }
                    ])}
                </div>

                <div class="action-buttons">
                    <a href="calculator.html" class="btn btn-primary" aria-label="Edit your budget">
                        <i class="fas fa-edit" aria-hidden="true"></i>
                        <span>Edit Budget</span>
                    </a>
                    <a href="step2.html" class="btn btn-secondary" aria-label="Continue to next step">
                        <i class="fas fa-arrow-right" aria-hidden="true"></i>
                        <span>Next</span>
                    </a>
                </div>
            `;
        }

        function createCategoryCard(title, icon, categoryData, currency, color, items) {
            if (!categoryData || categoryData.total === 0) return '';

            const itemsHTML = items
                .filter(item => item.value > 0)
                .map(item => `
                    <li class="category-item">
                        <span class="item-name">${item.name}</span>
                        <span class="item-value" aria-label="${item.name}: ${currency}${item.value.toFixed(2)}">${currency}${item.value.toFixed(2)}</span>
                    </li>
                `).join('');

            return `
                <article class="category-card" tabindex="0" aria-labelledby="${title.replace(/\s+/g, '-').toLowerCase()}-heading">
                    <header class="category-header">
                        <div class="category-title">
                            <div class="category-icon" style="background: linear-gradient(135deg, ${color}, ${adjustColor(color, -20)})" aria-hidden="true">
                                <i class="fas ${icon}"></i>
                            </div>
                            <h3 id="${title.replace(/\s+/g, '-').toLowerCase()}-heading">${title}</h3>
                        </div>
                        <div class="category-total" aria-label="${title} total: ${currency}${categoryData.total.toFixed(2)}">
                            ${currency}${categoryData.total.toFixed(2)}
                        </div>
                    </header>
                    ${itemsHTML ? `<ul class="category-items">${itemsHTML}</ul>` : ''}
                </article>
            `;
        }

        function adjustColor(color, amount) {
            const num = parseInt(color.replace('#', ''), 16);
            const r = Math.max(0, Math.min(255, (num >> 16) + amount));
            const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amount));
            const b = Math.max(0, Math.min(255, (num & 0x0000FF) + amount));
            return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
        }
    </script>
</body>

</html>
